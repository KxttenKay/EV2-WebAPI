<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>DragonBall API</title>
</head>
<body>
    
    <header id="inicio">
        <h1>Personajes de Dragon Ball</h1>
        <p>Aprende sobre los variados personajes del anime Dragon Ball</p>
    </header>

    <main>
        <nav>
        <!-- Link que dirige hacia la API utilizada. -->
    <a href="https://web.dragonball-api.com/">API</a>
    </nav>

    <!-- Es donde puedes buscar a los personajes, sea por nombre o raza. -->
    <section id="barrabusqueda">
        <h2>Aquí puedes buscar a los personajes</h2>
        <label for="buscador">Ingresa el Nombre o Raza de algún personaje:</label>
        <input type="text" id="buscador" placeholder="Goku, Saiyan...">
    </section>

    <!-- Es donde JS genera las tarjetas de los personajes de Dragon Ball. -->
    <section id="personajes" class="users"></section>

    </main>

    <footer>
        <a href="#personajes">Personajes</a>
         <a href="#inicio">Inicio</a>
    </footer>
    

    


<script src="assets/js/script.js"></script>
</body>
</html>
